name: CI

on:
  push:
    branches: ["main", "deep-project-audit"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abroad_bulletin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/abroad_bulletin_test
      # Test-only values. Real secrets never live in the repository.
      SESSION_HASH_SECRET: ci-session-hash-secret-value-not-used-in-production
      BFF_SHARED_SECRET: ci-bff-shared-secret-value-not-used-in-production
      BACKEND_URL: http://127.0.0.1:8000
      # No proxy in front of the app under test.
      TRUSTED_PROXY_HOP_COUNT: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma Client must exist before TypeScript sees any import of it.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # eslint exits 0 on warnings, so warning count could creep up unnoticed.
      # This fails when any rule exceeds its committed baseline.
      - name: Lint baseline (no new warnings)
        run: npm run lint:baseline

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Now gating: production dependencies are clean, so a new high-severity
      # advisory should stop a merge rather than scroll past in a log. Moderate
      # and low findings are still reported without failing.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report all production advisories
        if: always()
        run: npm audit --omit=dev || true
